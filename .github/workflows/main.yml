name: App Tests

on:
  push:
    branches:
      - "*"
  pull_request:

defaults:
  run:
    # -l: use login shell (required when using Conda)
    shell: bash -l {0}

jobs:
  backend_testing:
    name: Backend regression tests (${{ matrix.os }})
    runs-on: ${{ matrix.os-version }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - linux
          - win64
        include:
          - os: linux
            os-version: ubuntu-22.04
          - os: win64
            os-version: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          # Includes backend/requirements.txt through the environment's pip section.
          environment-file: environment.yml
          miniforge-version: latest
          activate-environment: pareto-ui-env
          run-post: false

      - name: Install IDAES solvers
        run: idaes get-extensions

      - name: Run backend regression tests
        env:
          PYTHONPATH: backend
          PARETO_DATA_BASEDIR: ${{ runner.temp }}/pareto-backend-tests/data
          PARETO_LOG_DIR: ${{ runner.temp }}/pareto-backend-tests/logs
        run: python -m unittest discover -s backend/tests

      - name: Clean up Conda environment
        if: always()
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source C:/Users/runneradmin/miniconda3/etc/profile.d/conda.sh
          fi
          conda deactivate || true
          conda env remove --name pareto-ui-env || true

  component_testing:
    name: Component and desktop tests (${{ matrix.os }})
    runs-on: ${{ matrix.os-version }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os:
          - linux
          - win64
        include:
          - os: linux
            os-version: ubuntu-22.04
          - os: win64
            os-version: windows-latest
    env:
      CI: "true"
      # Jest and the desktop unit tests do not launch Cypress.
      CYPRESS_INSTALL_BINARY: "0"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match environment.yml without installing the Python/solver environment.
          node-version: "18"
          cache: npm
          cache-dependency-path: electron/ui/package-lock.json

      - name: Install frontend JS dependencies
        run: npm --prefix electron/ui clean-install

      - name: Check TypeScript
        run: node electron/ui/node_modules/typescript/bin/tsc --noEmit --project electron/ui/tsconfig.json

      - name: Lint TypeScript
        run: npm --prefix electron/ui run lint

      - name: Check API contracts with strict TypeScript
        run: node electron/ui/node_modules/typescript/bin/tsc --noEmit --project electron/ui/tsconfig.contracts.json

      - name: Run component tests
        run: npm --prefix electron/ui test -- --watchAll=false --runInBand

      - name: Run desktop settings tests
        run: node --test electron/tests/*.test.cjs

  e2e_testing:
    name: E2E testing (${{ matrix.os }})

    runs-on: ${{ matrix.os-version }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - linux
          - win64
        include:
          - os: linux
            os-version: ubuntu-22.04
          - os: win64
            os-version: windows-latest
    env:
      CI: "true"
      BROWSER: none
      REACT_APP_PARETO_VERSION: "1.0.0"

    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          miniforge-version: latest
          activate-environment: pareto-ui-env
          # Hosted runners are discarded; the environment is removed below.
          # Avoid a second, slow deletion of Conda's shared package cache on Windows.
          run-post: false

      - name: Install IDAES solvers
        run: idaes get-extensions

      - name: Install frontend JS dependencies
        run: npm --prefix electron/ui clean-install

      - name: Start backend server
        working-directory: backend/app
        env:
          PARETO_DATA_BASEDIR: ${{ runner.temp }}/pareto-e2e/data
          PARETO_LOG_DIR: ${{ runner.temp }}/pareto-e2e/logs
        run: python main.py > "$RUNNER_TEMP/pareto-backend.log" 2>&1 &

      - name: Start frontend
        run: npm --prefix electron/ui start > "$RUNNER_TEMP/pareto-frontend.log" 2>&1 &

      - name: Wait for backend and frontend
        timeout-minutes: 4
        run: |
          node electron/ui/node_modules/wait-on/bin/wait-on --timeout 180000 --log \
            http-get://127.0.0.1:50011/get_project_name \
            http-get://127.0.0.1:3000

      - name: Cypress e2e tests
        working-directory: electron/ui
        timeout-minutes: 24
        run: |
          npx cypress run
      - name: Upload Cypress artifacts and server logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
            name: cypress_results-${{ matrix.os }}
            path: |
              electron/ui/cypress/screenshots/
              electron/ui/cypress/videos/
              ${{ runner.temp }}/pareto-backend.log
              ${{ runner.temp }}/pareto-frontend.log

      # Stop the backend before removing its Conda environment on hosted runners.
      - name: Kill Python processes
        if: always()
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            powershell.exe -Command "Get-Process python | Stop-Process -Force"
          else
            pkill -f python || echo "No Python processes found"
          fi

      - name: Clean up Conda environment
        if: always()
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source C:/Users/runneradmin/miniconda3/etc/profile.d/conda.sh
          fi
          conda deactivate || true
          conda env remove --name pareto-ui-env || true
